name: CI

on:
  pull_request:
    branches: [main]
  merge_group:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate YAML
        run: |
          pip install yamllint
          yamllint -d '{extends: relaxed, rules: {line-length: disable, new-line-at-end-of-file: disable}}' .
